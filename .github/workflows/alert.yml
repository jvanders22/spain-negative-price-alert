name: daily-alert

on:
  schedule:
    # Target Madrid times 13:17, 13:47, 14:47, 16:17. Cron is UTC, so cover both offsets:
    #   CET  (UTC+1, winter): 12:17, 12:47, 13:47, 15:17 UTC
    #   CEST (UTC+2, summer): 11:17, 11:47, 12:47, 14:17 UTC
    # Union below. Runs that land at other Madrid times early-exit ("already processed" or "pending");
    # the --deadline 16:00 check makes the 16:17 Madrid run fail loudly if OMIE is still missing.
    - cron: "17 11 * * *" # 13:17 CEST
    - cron: "47 11 * * *" # 13:47 CEST
    - cron: "17 12 * * *" # 13:17 CET
    - cron: "47 12 * * *" # 13:47 CET | 14:47 CEST
    - cron: "47 13 * * *" # 14:47 CET
    - cron: "17 14 * * *" # 16:17 CEST
    - cron: "17 15 * * *" # 16:17 CET
  workflow_dispatch:
    inputs:
      date:
        description: "Delivery date YYYY-MM-DD (default: tomorrow, Europe/Madrid)"
        required: false
        default: ""
      force:
        description: "Reprocess even if already in history"
        type: boolean
        default: false
      dry_run:
        description: "Run but don't commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    outputs:
      processed: ${{ steps.run.outputs.processed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch, validate, publish
        id: run
        env:
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(run --deadline 16:00)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          negprice "${args[@]}"
      - name: Commit outputs
        if: steps.run.outputs.processed == 'true' && !inputs.dry_run
        env:
          DATE: ${{ steps.run.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site drafts
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: OMIE day-ahead for $DATE"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1

  pages:
    # Disabled by default: GitHub Pages on the Free plan needs a public repo. Set repo variable
    # PAGES_ENABLED=true (and Pages source = GitHub Actions) to turn it on.
    needs: alert
    if: vars.PAGES_ENABLED == 'true' && needs.alert.outputs.processed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # include the data commit made by the alert job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
