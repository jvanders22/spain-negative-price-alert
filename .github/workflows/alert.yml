name: daily-alert

on:
  schedule:
    # Target Madrid times 13:17, 13:47, 14:47, 16:17. Cron is UTC, so cover both offsets:
    #   CET  (UTC+1, winter): 12:17, 12:47, 13:47, 15:17 UTC
    #   CEST (UTC+2, summer): 11:17, 11:47, 12:47, 14:17 UTC
    # Union below. Runs that land at other Madrid times early-exit ("already processed" or "pending");
    # the --deadline 16:00 check makes the 16:17 Madrid run fail loudly if OMIE is still missing.
    - cron: "17 11 * * *" # 13:17 CEST
    - cron: "47 11 * * *" # 13:47 CEST
    - cron: "17 12 * * *" # 13:17 CET
    - cron: "47 12 * * *" # 13:47 CET | 14:47 CEST
    - cron: "47 13 * * *" # 14:47 CET
    - cron: "17 14 * * *" # 16:17 CEST
    - cron: "17 15 * * *" # 16:17 CET
    # Evening PVPC refresh, target 21:17 Madrid (PVPC for D+1 is published ~20:15 Madrid):
    #   CEST (UTC+2, summer): 19:17 UTC
    #   CET  (UTC+1, winter): 20:17 UTC
    # Each also fires an hour off in the other season (20:17 CET / 22:17 CEST); those runs are harmless:
    # "not published yet" or "already cached". The "Fetch, validate, publish" step runs
    # `negprice pvpc-refresh` instead of `run` for exactly these two cron strings; keep them in sync.
    - cron: "17 19 * * *" # 21:17 CEST | 20:17 CET
    - cron: "17 20 * * *" # 21:17 CET | 22:17 CEST
    # Sunday weekly summary, target 10:17 Madrid (the week Mon-Sun is complete: Sunday's prices were
    # published on Saturday):
    #   CEST (UTC+2, summer): 08:17 UTC
    #   CET  (UTC+1, winter): 09:17 UTC
    # Each also fires an hour off in the other season (09:17 CET / 11:17 CEST). The duplicate is harmless:
    # `negprice weekly` is idempotent and exits "already built" when site/weekly/<sunday>.json exists and
    # is identical. The "Fetch, validate, publish" step runs `negprice weekly` for exactly these two cron
    # strings; keep them in sync.
    - cron: "17 8 * * 0" # Sun 10:17 CEST | 09:17 CET
    - cron: "17 9 * * 0" # Sun 10:17 CET | 11:17 CEST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = process a delivery day; weekly = build the weekly summary"
        type: choice
        options: [daily, weekly]
        default: daily
      date:
        description: "daily: delivery date YYYY-MM-DD (default: tomorrow, Europe/Madrid); weekly: week-ending Sunday (default: latest complete week)"
        required: false
        default: ""
      force:
        description: "Reprocess even if already in history"
        type: boolean
        default: false
      dry_run:
        description: "Run but don't commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    outputs:
      processed: ${{ steps.run.outputs.processed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch, validate, publish
        id: run
        env:
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCHEDULE" = "17 19 * * *" ] || [ "$SCHEDULE" = "17 20 * * *" ]; then
            echo "mode=pvpc" >> "$GITHUB_OUTPUT"
            negprice pvpc-refresh
            exit 0
          fi
          if [ "$SCHEDULE" = "17 8 * * 0" ] || [ "$SCHEDULE" = "17 9 * * 0" ] || [ "$RUN_MODE" = "weekly" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
            args=(weekly)
            if [ -n "$DATE" ]; then args+=(--week-ending "$DATE"); fi
            negprice "${args[@]}"
            exit 0
          fi
          args=(run --deadline 16:00)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          negprice "${args[@]}"
      - name: Commit outputs
        if: steps.run.outputs.processed == 'true' && !inputs.dry_run
        env:
          DATE: ${{ steps.run.outputs.date }}
          MODE: ${{ steps.run.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/pvpc site  # drafts/ is gitignored: uploaded as an artifact below
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "$MODE" = "pvpc" ]; then
            git commit -m "data: PVPC context for $DATE"
          elif [ "$MODE" = "weekly" ]; then
            git commit -m "data: weekly summary week ending $DATE"
          else
            git commit -m "data: OMIE day-ahead for $DATE"
          fi
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
      # X drafts are never committed (drafts/ is gitignored). They are kept as a short-lived artifact for
      # Josh to review. Note: on a public repo, artifacts can be downloaded by any signed-in GitHub user.
      - name: Upload X draft (artifact, not committed)
        if: >-
          steps.run.outputs.processed == 'true' && steps.run.outputs.mode != 'pvpc'
          && steps.run.outputs.mode != 'weekly'
        uses: actions/upload-artifact@v4
        with:
          name: x-draft-${{ steps.run.outputs.date }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload weekly X drafts (artifact, not committed)
        if: steps.run.outputs.processed == 'true' && steps.run.outputs.mode == 'weekly'
        uses: actions/upload-artifact@v4
        with:
          name: x-draft-weekly-${{ steps.run.outputs.date }}
          path: drafts/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    # Disabled by default: GitHub Pages on the Free plan needs a public repo. Set repo variable
    # PAGES_ENABLED=true (and Pages source = GitHub Actions) to turn it on.
    needs: alert
    if: vars.PAGES_ENABLED == 'true' && needs.alert.outputs.processed == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # include the data commit made by the alert job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
