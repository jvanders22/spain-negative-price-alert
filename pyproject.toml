[project]
name = "spain-negative-price-alert"
version = "0.1.0"
description = "Daily alert for zero/negative Spanish day-ahead power prices (OMIE): history, JSON/RSS feed, chart, static page, X drafts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Josh Vanderspuy" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
seed = ["pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5", "feedparser>=6", "jsonschema>=4", "pyarrow>=15"]

[project.scripts]
negprice = "negprice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
negprice = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
